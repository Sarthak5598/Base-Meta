# Sample source database for development.
#   docker compose up -d
# Read-only user: Host=localhost;Port=5433;Database=shop;Username=datalens_ro;Password=readonly
# Admin user (can write, triggers the warning): Username=shop_admin;Password=admin
services:
  sample-db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"   # 5433 so it does not clash with a Postgres already on 5432
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - sample-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A big version of the same shop (about 100k customers, 2M orders, 5M order lines, 2M events, ~800 MB).
  # Not started by default. The first start takes a minute or two while it fills:
  #   docker compose --profile big up -d big-db
  # Read-only user: Host=localhost;Port=5434;Database=shop;Username=datalens_ro;Password=readonly
  big-db:
    image: postgres:16
    profiles: ["big"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - ./db/init/01-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./db/big/02-scale.sql:/docker-entrypoint-initdb.d/02-scale.sql:ro
      - big-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  sample-db-data:
  big-db-data:
